name: Build Fluent Loop APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # فك ضغط ملف ZIP تلقائياً أينما وجد داخل المستودع
      - name: Extract Project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d temp_extracted/
            cp -rn temp_extracted/*/* . 2>/dev/null || cp -rn temp_extracted/* . 2>/dev/null || true
            rm -rf temp_extracted
          else
            echo "No ZIP file found, proceeding with repository root files."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluent-loop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
