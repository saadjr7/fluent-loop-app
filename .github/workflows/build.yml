name: Build Android APK (TWA / Bubblewrap)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Setup Bubblewrap Configuration
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

      - name: Generate twa-manifest & Build APK
        run: |
          if [ ! -f "twa-manifest.json" ]; then
            echo "Creating local twa-manifest.json..."
            cat <<EOF > twa-manifest.json
          {
            "packageId": "app.netlify.fluent_loop.twa",
            "host": "fluent-loop.netlify.app",
            "name": "Fluent Loop",
            "launcherName": "FluentLoop",
            "display": "standalone",
            "themeColor": "#FFFFFF",
            "navigationColor": "#000000",
            "backgroundColor": "#FFFFFF",
            "startUrl": "/",
            "iconUrl": "https://fluent-loop.netlify.app/favicon.ico",
            "maskableIconUrl": "https://fluent-loop.netlify.app/favicon.ico",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://fluent-loop.netlify.app/",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableNotifications": false,
            "isChromeOSOnly": false,
            "minSdkVersion": 21
          }
          EOF
          fi

          bubblewrap build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            **/*.apk
            **/*.aab
