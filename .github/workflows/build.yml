name: Build Fluent Loop APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. فك ضغط ملف ZIP أينما كان
      - name: Extract Project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d temp_extracted/
            cp -rn temp_extracted/*/* . 2>/dev/null || cp -rn temp_extracted/* . 2>/dev/null || true
            rm -rf temp_extracted
          fi

      # 2. تنظيم ملفات الويب داخل مجلد www لتفادي الشاشة البيضاء
      - name: Prepare Web Assets Folder
        run: |
          mkdir -p www
          # نقل ملفات HTML و JS و CSS والأيقونات والميديا لداخل www إذا لم تكن فيه
          if [ -f "index.html" ]; then
            cp -r index.html *.js *.css *.json audio icons www/ 2>/dev/null || true
          fi

      # 3. إعداد بيئة Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 4. إعداد بيئة Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 5. تثبيت الحزم ومزامنة Capacitor مع مجلد www
      - name: Install dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      # 6. إعطاء صلاحيات التشغيل وبناء الـ APK
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # 7. رفع ملف الـ APK النهائي
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluent-loop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
