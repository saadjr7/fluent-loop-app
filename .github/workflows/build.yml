name: Build Fluent Loop APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. استخراج محتويات ZIP مباشرة واستخراج مجلد www منها
      - name: Extract ZIP structure
        run: |
          mkdir -p temp_zip
          unzip -o fluent-loop-audio-test-capacitor.zip -d temp_zip/

          # العثور على مجلد www المباشر ونسخه للجذر
          WWW_PATH=$(find temp_zip -type d -name "www" | head -n 1)
          if [ -n "$WWW_PATH" ]; then
            echo "Found www directory at: $WWW_PATH"
            rm -rf www
            cp -r "$WWW_PATH" .
          fi

          # نقل باقي الملفات الأساسية إن وجدت
          cp -rn temp_zip/*/* . 2>/dev/null || cp -rn temp_zip/* . 2>/dev/null || true
          rm -rf temp_zip

          # التأكد من وجود index.html داخل مجلد www
          ls -la www/

      # 2. إعداد بيئات التشغيل
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. تثبيت المكتبات وتطابق المجلدات مع Capacitor
      - name: Install dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      # 4. إعطاء صلاحيات وبناء الـ APK
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # 5. رفع ملف ה-APK للتنزيل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluent-loop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
