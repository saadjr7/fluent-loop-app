name: Build Fluent Loop APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. تفريغ الـ ZIP ونسخ كافة المحتويات إلى مجلد www
      - name: Extract ZIP and Prepare www
        run: |
          mkdir -p temp_extracted
          unzip -o fluent-loop-audio-test-capacitor.zip -d temp_extracted/
          
          # إنشاء مجلد www وتفريغه
          rm -rf www
          mkdir -p www

          # البحث عن ملف index.html ونسخ مجلده بالكامل إلى www
          INDEX_PATH=$(find temp_extracted -name "index.html" | head -n 1)
          if [ -n "$INDEX_PATH" ]; then
            SOURCE_DIR=$(dirname "$INDEX_PATH")
            echo "Found index.html in: $SOURCE_DIR"
            cp -r "$SOURCE_DIR"/* www/
          else
            echo "Warning: index.html not found in ZIP!"
          fi

          # إظهار محتويات مجلد www للتأكد في السجلات
          ls -la www/

      # 2. إعداد بيئة العمل
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. تثبيت الحزم ومزامنة Capacitor
      - name: Install dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      # 4. بناء ملف APK
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # 5. رفع ملف ה-APK النهائي
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluent-loop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
