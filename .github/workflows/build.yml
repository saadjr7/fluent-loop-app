name: Build Android APK (TWA / Bubblewrap)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Setup Bubblewrap Configuration
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

      - name: Build APK using Bubblewrap
        run: |
          # التحقق من وجود manifest وإذا لم يوجد يتم إنشاؤه تلقائياً من رابط الـ PWA
          if [ ! -f "twa-manifest.json" ]; then
            echo "Manifest not found. Initializing Bubblewrap project..."
            bubblewrap init --manifest="https://fluent-loop.netlify.app/manifest.json"
          fi

          bubblewrap build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            **/*.apk
            **/*.aab
